<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Cyber Syndicate 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-main: #030712;
            --panel-inner: #0b0f19;
            --panel-border: #1f293d;
            --accent-neon: #00f0ff;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --accent-crimson: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --cell-w: 110px;
            --cell-h: 110px;
            --board-size: calc(var(--cell-w) * 7 + 30px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .neon-grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            z-index: 10;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        }

        header p {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* ЕКРАН АВТОРИЗАЦІЇ */
        #auth-screen {
            background: var(--panel-inner);
            border: 2px solid var(--panel-border);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.05);
            z-index: 20;
            margin-top: 40px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            color: var(--accent-neon);
        }

        .input-block {
            margin-bottom: 20px;
        }

        .input-block label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-block input, .input-block select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .role-details-box {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--accent-purple);
            padding: 12px 16px;
            border-radius: 0 12px 12px 0;
            margin-top: 10px;
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.6;
        }

        .btn-core {
            background: linear-gradient(135deg, var(--accent-neon) 0%, var(--accent-purple) 100%);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
            transition: 0.2s ease;
        }

        /* ІГРОВИЙ ЕКРАН */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 1400px;
            z-index: 10;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .board-container {
            background: #020205;
            padding: 12px;
            border-radius: 28px;
            box-shadow: 0 35px 70px rgba(0,0,0,0.9), 0 0 40px rgba(0,240,255,0.03);
            border: 1px solid var(--panel-border);
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-w));
            grid-template-rows: repeat(7, var(--cell-h));
            gap: 5px;
            width: var(--board-size);
            height: var(--board-size);
        }

        .cell {
            background: var(--panel-inner);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px 6px;
            position: relative;
        }

        .cell-stripe {
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            border-radius: 10px 10px 0 0;
        }

        .cell-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            color: #f3f4f6;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 5px;
        }

        .cell-icon {
            font-size: 22px;
            margin: auto 0;
        }

        .cell-price {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-neon);
        }

        .cell-buildings {
            position: absolute;
            top: 10px;
            display: flex;
            gap: 2px;
        }
        .b-dot {
            width: 6px; height: 6px;
            background: var(--accent-orange);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent-orange);
        }
        .b-hub {
            width: 14px; height: 6px;
            background: var(--accent-purple);
            border-radius: 2px;
            box-shadow: 0 0 5px var(--accent-purple);
        }

        .cell-owner-label {
            position: absolute;
            bottom: 24px;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Сітка 7x7 */
        .pos-0  { grid-column: 1; grid-row: 1; }
        .pos-1  { grid-column: 2; grid-row: 1; }
        .pos-2  { grid-column: 3; grid-row: 1; }
        .pos-3  { grid-column: 4; grid-row: 1; }
        .pos-4  { grid-column: 5; grid-row: 1; }
        .pos-5  { grid-column: 6; grid-row: 1; }
        .pos-6  { grid-column: 7; grid-row: 1; }
        .pos-7  { grid-column: 7; grid-row: 2; }
        .pos-8  { grid-column: 7; grid-row: 3; }
        .pos-9  { grid-column: 7; grid-row: 4; }
        .pos-10 { grid-column: 7; grid-row: 5; }
        .pos-11 { grid-column: 7; grid-row: 6; }
        .pos-12 { grid-column: 7; grid-row: 7; }
        .pos-13 { grid-column: 6; grid-row: 7; }
        .pos-14 { grid-column: 5; grid-row: 7; }
        .pos-15 { grid-column: 4; grid-row: 7; }
        .pos-16 { grid-column: 3; grid-row: 7; }
        .pos-17 { grid-column: 2; grid-row: 7; }
        .pos-18 { grid-column: 1; grid-row: 7; }
        .pos-19 { grid-column: 1; grid-row: 6; }
        .pos-20 { grid-column: 1; grid-row: 5; }
        .pos-21 { grid-column: 1; grid-row: 4; }
        .pos-22 { grid-column: 1; grid-row: 3; }
        .pos-23 { grid-column: 1; grid-row: 2; }

        .board-center-hub {
            grid-column: 2 / 7;
            grid-row: 2 / 7;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* 3D КУБИКИ */
        .dice-zone {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            perspective: 400px;
        }

        .cube3d {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateY(45deg);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1.1);
        }

        .cube3d-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            color: #0f172a;
            font-weight: 900;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 0 10px rgba(255,255,255,0.1);
        }

        .face-1 { transform: rotateY(0deg) translateZ(30px); }
        .face-2 { transform: rotateY(90deg) translateZ(30px); }
        .face-3 { transform: rotateY(180deg) translateZ(30px); }
        .face-4 { transform: rotateY(-90deg) translateZ(30px); }
        .face-5 { transform: rotateX(90deg) translateZ(30px); }
        .face-6 { transform: rotateX(-90deg) translateZ(30px); }

        .token-container {
            position: absolute;
            bottom: 6px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            z-index: 5;
        }

        .p-token {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        .side-dashboard {
            flex: 1;
            min-width: 340px;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dashboard-card {
            background: var(--panel-inner);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 18px;
        }

        .dashboard-card h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .corp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 4px solid transparent;
        }

        .corp-row.active-turn {
            border-left-color: var(--accent-neon);
            background: rgba(0, 240, 255, 0.04);
        }

        .corp-money {
            font-weight: 800;
            color: var(--accent-green);
            font-family: monospace;
            font-size: 15px;
        }

        .actions-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-trigger-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        .btn-roll {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: #000;
        }
        .btn-buy {
            background: linear-gradient(135deg, var(--accent-neon), #0284c7);
            color: #000;
        }
        .btn-upgrade {
            background: linear-gradient(135deg, var(--accent-orange), #ea580c);
            color: #fff;
        }
        .btn-pass {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: #fff;
        }

        .action-trigger-btn:disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        .log-terminal {
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-line {
            padding: 6px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border-left: 2px solid var(--panel-border);
        }

        .log-line.system { border-left-color: var(--accent-neon); color: var(--accent-neon); }
        .log-line.danger { border-left-color: var(--accent-crimson); color: var(--accent-crimson); }
        .log-line.success { border-left-color: var(--accent-green); color: var(--accent-green); }

        .event-banner {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--accent-purple);
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #e9d5ff;
            display: none;
        }

        @media (max-width: 1024px) {
            :root {
                --cell-w: 13.5vw;
                --cell-h: 13.5vw;
            }
            .side-dashboard { width: var(--board-size); }
        }
    </style>
</head>
<body>

    <div class="neon-grid-bg"></div>

    <header>
        <h1>Cyber Syndicate</h1>
        <p>Ukraine Corporate War Engine 2026</p>
    </header>

    <!-- АВТОРИЗАЦІЯ -->
    <div id="auth-screen">
        <div class="form-title">Ініціалізація Синдикату</div>
        <div class="input-block">
            <label>Назва Вашої Корпорації</label>
            <input type="text" id="player-name-input" value="Кібер Холдинг">
        </div>
        <div class="input-block">
            <label>Профільна Стратегія</label>
            <select id="player-role-input" onchange="Engine.UI.updateRolePreview()">
                <option value="shark">🦈 Акула Ринку (Прискорений капітал кола)</option>
                <option value="investor">💰 Венчур (Дивіденди з чужих апгрейдів)</option>
                <option value="technocrat">💼 Технократ (Знижка на будівництво хабів)</option>
            </select>
            <div id="role-preview" class="role-details-box"></div>
        </div>
        <button class="btn-core" onclick="Engine.Core.launchGame()">Створити Сесію</button>
    </div>

    <!-- ПОЛЕ ГРИ -->
    <div id="game-screen">
        <div class="main-layout">
            
            <div class="board-container">
                <div class="board-grid" id="board-dom-target">
                    
                    <div class="board-center-hub">
                        <div style="font-size: 11px; font-weight: 900; opacity: 0.2; letter-spacing: 5px;">SYS_DOMINANCE</div>
                        
                        <!-- 3D КУБИКИ В ЦЕНТРІ ПОЛЯ -->
                        <div class="dice-zone">
                            <div class="cube3d" id="cube-1">
                                <div class="cube3d-face face-1">⚀</div>
                                <div class="cube3d-face face-2">⚁</div>
                                <div class="cube3d-face face-3">⚂</div>
                                <div class="cube3d-face face-4">⚃</div>
                                <div class="cube3d-face face-5">⚄</div>
                                <div class="cube3d-face face-6">⚅</div>
                            </div>
                            <div class="cube3d" id="cube-2">
                                <div class="cube3d-face face-1">⚀</div>
                                <div class="cube3d-face face-2">⚁</div>
                                <div class="cube3d-face face-3">⚂</div>
                                <div class="cube3d-face face-4">⚃</div>
                                <div class="cube3d-face face-5">⚄</div>
                                <div class="cube3d-face face-6">⚅</div>
                            </div>
                        </div>

                        <div id="turn-status" style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent-neon);">Очікування команд...</div>
                        <div class="event-banner" id="current-event-banner"></div>
                    </div>

                </div>
            </div>

            <!-- БІЧНА ПАНЕЛЬ КЕРУВАННЯ -->
            <div class="side-dashboard">
                <div class="dashboard-card" style="border-color: var(--accent-neon);">
                    <h3>⚡ Операційний Термінал</h3>
                    <div class="actions-grid">
                        <!-- КНОПКА КИДКА ТУТ, ПРАВОРУЧ ВІД КАРТИ -->
                        <button class="action-trigger-btn btn-roll" id="btn-roll" onclick="Engine.Gameplay.rollDice3D()">🎲 Ініціювати кидок</button>
                        <button class="action-trigger-btn btn-buy" id="btn-buy" style="display: none;">🛒 Викупити активи</button>
                        <button class="action-trigger-btn btn-upgrade" id="btn-upgrade" style="display: none;">🏢 Побудувати Філіал</button>
                        <button class="action-trigger-btn btn-pass" id="btn-pass" onclick="Engine.Gameplay.completeTurn()" style="display: none;">👉 Зафіксувати прибуток</button>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>📈 Реєстр Акціонерів</h3>
                    <div id="investor-list-target"></div>
                </div>

                <div class="dashboard-card">
                    <h3>📜 Протокол Транзакцій</h3>
                    <div class="log-terminal" id="terminal-target"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const Engine = {

                ],

                roles: {
                    shark: "🦈 Капітал за коло збільшений до $450.",
                    investor: "💰 Отримує $50 від банку за кожну побудовану філію суперника.",
                    technocrat: "💼 Знижка 30% на будь-яку модернізацію та будівництво хабів."
                },
                marketEvents: [
                    { title: "🔌 КРИЗА ЕНЕРГОСИСТЕМИ", desc: "Сектор Енергетики призупиняє збір оренди на 1 коло.", target: "energy", modifier: 0 },
                    { title: "💻 ЦИФРОВИЙ БУМ", desc: "Доходи IT-сектору подвоєно на наступні 3 ходи!", target: "it", modifier: 2 },
                    { title: "🏛️ ДЕРЖАВНИЙ АУДИТ", desc: "Усі власники компаній групи Ритейл сплачують штраф $100 за кожну точку.", target: "retail", modifier: -100 },
                    { title: "📦 ЛОГІСТИЧНИЙ ПРОРИВ", desc: "Нова Пошта та Укрпошта збільшують рентабельність на 50%.", target: "delivery", modifier: 1.5 }
                ]
            },

            State: {
                turn: "p1",
                players: {},
                logs: [],
                lastDice: [1, 1],
                isRolling: false,
                activeModifier: null,
                modifierTurns: 0
            },

            Core: {
                launchGame: function() {
                    Engine.Audio.init();
                    const name = document.getElementById('player-name-input').value || "Кібер Холдинг";
                    const role = document.getElementById('player-role-input').value;

                    Engine.State.players = {
                        p1: { id: "p1", name: name, role: role, money: Engine.Config.startCapital, pos: 0, color: "var(--accent-neon)", isBot: false, inJail: 0 },
                        bot: { id: "bot", name: "Олігарх-ШІ (BlackRock)", role: "shark", money: Engine.Config.startCapital, pos: 0, color: "var(--accent-crimson)", isBot: true, inJail: 0 }
                    };

                    Engine.State.logs.push({ type: "system", text: "⚙️ Протокол синхронізації фінансових систем запущено." });
                    
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';

                    Engine.UI.generateMap();
                    Engine.UI.sync();
                }
            },

            Gameplay: {
                rollDice3D: function() {
                    if (Engine.State.turn !== "p1" || Engine.State.isRolling) return;
                    
                    let p = Engine.State.players[Engine.State.turn];
                    
                    if(p.inJail > 0) {
                        p.inJail--;
                        Engine.State.logs.push({ type: "danger", text: `🚔 ${p.name} перебуває під перевіркою ТЦК. Пропуск ходу.` });
                        Engine.Gameplay.completeTurn();
                        return;
                    }

                    Engine.State.isRolling = true;
                    Engine.Audio.triggerSound('dice');

                    const c1 = document.getElementById('cube-1');
                    const c2 = document.getElementById('cube-2');

                    let randX = Math.floor(Math.random() * 4 + 4) * 360;
                    let randY = Math.floor(Math.random() * 4 + 4) * 360;

                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    Engine.State.lastDice = [d1, d2];

                    const rotations = {
                        1: {x: 0, y: 0}, 2: {x: 0, y: -90}, 3: {x: 0, y: -180},
                        4: {x: 0, y: 90}, 5: {x: -90, y: 0}, 6: {x: 90, y: 0}
                    };

                    c1.style.transform = `rotateX(${randX + rotations[d1].x}deg) rotateY(${randY + rotations[d1].y}deg)`;
                    c2.style.transform = `rotateX(${randX + rotations[d2].x}deg) rotateY(${randY + rotations[d2].y}deg)`;

                    // Ховаємо кнопку тільки на момент анімації
                    document.getElementById('btn-roll').style.opacity = '0.3';
                    document.getElementById('btn-roll').disabled = true;

                    setTimeout(() => {
                        let oldPos = p.pos;
                        p.pos = (p.pos + d1 + d2) % Engine.Config.totalCells;

                        Engine.State.logs.push({ type: "system", text: `🎲 ${p.name} вибиває [${d1}:${d2}] та переходить на кл. ${p.pos}` });

                        if(p.pos < oldPos) {
                            let salary = p.role === 'shark' ? 450 : Engine.Config.lapSalary;
                            p.money += salary;
                            Engine.Audio.triggerSound('money');
                            Engine.State.logs.push({ type: "success", text: `💸 Пройдено операційне коло! Рахунок поповнено на +$${salary}` });
                        }

                        Engine.State.isRolling = false;
                        document.getElementById('btn-roll').style.opacity = '1';
                        document.getElementById('btn-roll').disabled = false;
                        
                        Engine.Gameplay.handleCellAction(p);
                    }, 800);
                },

                handleCellAction: function(p) {
                    let cell = Engine.Config.mapData[p.pos];
                    let buyBtn = document.getElementById('btn-buy');
                    let upgradeBtn = document.getElementById('btn-upgrade');
                    let passBtn = document.getElementById('btn-pass');

                    buyBtn.style.display = 'none';
                    upgradeBtn.style.display = 'none';
                    passBtn.style.display = 'block';

                    if(p.isBot) {
                        setTimeout(() => {
                            if(cell.type === "corp") {
                                if(!cell.owner && p.money >= cell.price + 200) {
                                    p.money -= cell.price;
                                    cell.owner = p.id;
                                    cell.lvl = 1;
                                    Engine.State.logs.push({ type: "danger", text: `🤖 ШІ викупив активи ${cell.name}` });
                                } else if(cell.owner === p.id && cell.lvl < 4 && p.money >= Math.round(cell.price * 0.5) + 300) {
                                    let cost = Math.round(cell.price * 0.5);
                                    p.money -= cost;
                                    cell.lvl++;
                                    Engine.State.logs.push({ type: "danger", text: `🏢 ШІ апгрейднув ${cell.name} до ${cell.lvl} рівня` });
                                } else if(cell.owner && cell.owner !== p.id) {
                                    let rent = Engine.Gameplay.getFinalRent(cell);
                                    p.money -= rent;
                                    Engine.State.players[cell.owner].money += rent;
                                    Engine.State.logs.push({ type: "success", text: `💸 ШІ виплатив вам оренду $${rent}` });
                                }
                            } else if(cell.type === "tax") {
                                p.money -= 200;
                            } else if(cell.type === "jail") {
                                p.inJail = 2;
                            } else if(cell.type === "chance") {
                                Engine.Gameplay.triggerChanceEvent(p);
                            }
                            Engine.Gameplay.completeTurn();
                        }, 1200);
                        return;
                    }

                    // Гравець
                    if(cell.type === "corp") {
                        if(!cell.owner) {
                            buyBtn.style.display = 'block';
                            buyBtn.innerText = `🛒 Купити ${cell.name} за $${cell.price}`;
                            buyBtn.disabled = p.money < cell.price;
                            buyBtn.onclick = () => {
                                p.money -= cell.price;
                                cell.owner = p.id;
                                cell.lvl = 1;
                                Engine.Audio.triggerSound('buy');
                                Engine.Gameplay.completeTurn();
                            };
                        } else if(cell.owner === p.id) {
                            if(cell.lvl < 4) {
                                let cost = Math.round(cell.price * 0.5);
                                if(p.role === 'technocrat') cost = Math.round(cost * 0.7);

                                upgradeBtn.style.display = 'block';
                                upgradeBtn.innerText = `🏢 Апгрейд структури за $${cost}`;
                                upgradeBtn.disabled = p.money < cost;
                                upgradeBtn.onclick = () => {
                                    p.money -= cost;
                                    cell.lvl++;
                                    Engine.Audio.triggerSound('buy');
                                    Engine.Gameplay.completeTurn();
                                };
                            }
                        } else {
                            let rent = Engine.Gameplay.getFinalRent(cell);
                            buyBtn.style.display = 'block';
                            passBtn.style.display = 'none';
                            buyBtn.innerText = `💸 Сплатити оренду $${rent}`;
                            buyBtn.disabled = false;
                            buyBtn.onclick = () => {
                                p.money -= rent;
                                Engine.State.players[cell.owner].money += rent;
                                Engine.Gameplay.completeTurn();
                            };
                        }
                    } else if(cell.type === "tax") {
                        buyBtn.style.display = 'block';
                        passBtn.style.display = 'none';
                        buyBtn.innerText = "🏛️ Сплатити держподаток $200";
                        buyBtn.onclick = () => {
                            p.money -= 200;
                            Engine.Gameplay.completeTurn();
                        };
                    } else if(cell.type === "jail") {
                        p.inJail = 2;
                        Engine.Audio.triggerSound('jail');
                        Engine.Gameplay.completeTurn();
                    } else if(cell.type === "chance") {
                        Engine.Gameplay.triggerChanceEvent(p);
                    }
                    Engine.UI.sync();
                },

                getFinalRent: function(cell) {
                    let base = cell.rent * Math.pow(2.2, cell.lvl - 1);
                    return Math.round(base);
                },

                triggerChanceEvent: function(p) {
                    let ev = Engine.Config.marketEvents[Math.floor(Math.random() * Engine.Config.marketEvents.length)];
                    Engine.State.activeModifier = ev;
                    Engine.State.modifierTurns = 3;
                    Engine.State.logs.push({ type: "system", text: `📢 ПОДІЯ: ${ev.title}.` });
                    
                    let banner = document.getElementById('current-event-banner');
                    banner.style.display = 'block';
                    banner.innerText = `🚨 ${ev.title}: ${ev.desc}`;
                },

                completeTurn: function() {
                    if(Engine.State.players.p1.money < 0) {
                        alert("💀 Банкрутство холдингу!");
                        location.reload();
                        return;
                    }

                    Engine.State.turn = Engine.State.turn === "p1" ? "bot" : "p1";
                    
                    document.getElementById('btn-buy').style.display = 'none';
                    document.getElementById('btn-upgrade').style.display = 'none';
                    document.getElementById('btn-pass').style.display = 'none';

                    Engine.UI.sync();

                    if(Engine.State.players[Engine.State.turn].isBot) {
                        setTimeout(() => { Engine.Gameplay.rollDice3D(); }, 1000);
                    }
                }
            },

            UI: {
                updateRolePreview: function() {
                    let val = document.getElementById('player-role-input').value;
                    document.getElementById('role-preview').innerText = Engine.Config.roles[val];
                },

                generateMap: function() {
                    let target = document.getElementById('board-dom-target');
                    let coreHTML = target.querySelector('.board-center-hub').outerHTML;
                    target.innerHTML = coreHTML;

                    Engine.Config.mapData.forEach(cell => {
                        let node = document.createElement('div');
                        node.className = `cell pos-${cell.id}`;
                        let stripeColor = cell.color || Engine.Config.colors[cell.group] || "#374151";
                        
                        node.innerHTML = `
                            <div class="cell-stripe" style="background:${stripeColor}"></div>
                            <div class="cell-buildings" id="build-box-${cell.id}"></div>
                            <div class="cell-title">${cell.name}</div>
                            <div class="cell-icon">${cell.icon || '🏢'}</div>
                            <div class="cell-owner-label" id="owner-lbl-${cell.id}"></div>
                            <div class="cell-price" id="price-lbl-${cell.id}">${cell.price ? '$'+cell.price : ''}</div>
                            <div class="token-container" id="token-box-${cell.id}"></div>
                        `;
                        target.appendChild(node);
                    });
                },

                sync: function() {
                    // Синхронізація власників
                    Engine.Config.mapData.forEach(cell => {
                        let tBox = document.getElementById(`token-box-${cell.id}`);
                        if(tBox) tBox.innerHTML = "";

                        let ownerLbl = document.getElementById(`owner-lbl-${cell.id}`);
                        let buildBox = document.getElementById(`build-box-${cell.id}`);

                        if(ownerLbl && cell.owner) {
                            let ownerObj = Engine.State.players[cell.owner];
                            ownerLbl.innerText = ownerObj.id === 'p1' ? 'Ти' : 'ШІ';
                            ownerLbl.style.backgroundColor = ownerObj.color;
                            ownerLbl.style.color = "#000";

                            if(buildBox) {
                                buildBox.innerHTML = "";
                                if(cell.lvl === 4) {
                                    buildBox.innerHTML = `<div class="b-hub"></div>`;
                                } else {
                                    for(let i=0; i<cell.lvl; i++) { buildBox.innerHTML += `<div class="b-dot"></div>`; }
                                }
                            }
                        }
                    });

                    // Фішки
                    Object.values(Engine.State.players).forEach(p => {
                        let tk = document.createElement('div');
                        tk.className = "p-token";
                        tk.style.backgroundColor = p.color;
                        let box = document.getElementById(`token-box-${p.pos}`);
                        if(box) box.appendChild(tk);
                    });

                    // Лідери
                    let list = document.getElementById('investor-list-target');
                    list.innerHTML = "";
                    Object.values(Engine.State.players).forEach(p => {
                        list.innerHTML += `
                            <div class="corp-row ${Engine.State.turn === p.id ? 'active-turn' : ''}">
                                <div><b>${p.name}</b> <br><small style="color:var(--text-muted)">${p.role.toUpperCase()}</small></div>
                                <div class="corp-money">$${p.money}</div>
                            </div>
                        `;
                    });

                    // --- ЖОРСТКИЙ ФІКС КНОПКИ КИДКА ---
                    let isP1 = Engine.State.turn === "p1";
                    document.getElementById('turn-status').innerText = isP1 ? "Ваша черга діяти" : "Аналіз ринку ботом ШІ...";
                    
                    let rBtn = document.getElementById('btn-roll');
                    // Кнопка має відображатися ЗАВЖДИ, якщо хід твій і не відкриті вікна купівлі/оплати
                    if (isP1 && 
                        document.getElementById('btn-buy').style.display === 'none' && 
                        document.getElementById('btn-upgrade').style.display === 'none' && 
                        document.getElementById('btn-pass').style.display === 'none') {
                        rBtn.style.display = 'block';
                    } else {
                        rBtn.style.display = 'none';
                    }

                    let term = document.getElementById('terminal-target');
                    term.innerHTML = Engine.State.logs.map(l => `<div class="log-line ${l.type}">${l.text}</div>`).reverse().join('');
                }
            },

            Audio: {
                context: null,
                init: function() {
                    if(!Engine.Audio.context) {
                        try { Engine.Audio.context = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
                    }
                },
                triggerSound: function(type) {
                    if(!Engine.Audio.context) return;
                    let ctx = Engine.Audio.context;
                    if(ctx.state === 'suspended') ctx.resume();

                    try {
                        let osc = ctx.createOscillator();
                        let gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);

                        if(type === 'dice') {
                            osc.frequency.setValueAtTime(280, ctx.currentTime);
                            gain.gain.setValueAtTime(0.04, ctx.currentTime);
                            osc.start(); osc.stop(ctx.currentTime + 0.08);
                        } else if(type === 'buy') {
                            osc.frequency.setValueAtTime(580, ctx.currentTime);
                            gain.gain.setValueAtTime(0.05, ctx.currentTime);
                            osc.start(); osc.stop(ctx.currentTime + 0.15);
                        } else if(type === 'money') {
                            osc.frequency.setValueAtTime(880, ctx.currentTime);
                            gain.gain.setValueAtTime(0.03, ctx.currentTime);
                            osc.start(); osc.stop(ctx.currentTime + 0.2);
                        }
                    } catch(err){}
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            Engine.UI.updateRolePreview();
            if(window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
