<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тобнута Монополія: Next Level</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо Firebase за допомогою CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --accent-color: #e94560;
            --text-color: #ffffff;
            --board-size: 600px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 5px; color: var(--accent-color); text-align: center; font-size: 24px; }
        
        /* Меню авторизації та вибору персонажа */
        #auth-screen, #lobby-screen {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 50px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        input, select { background: #0f3460; color: #fff; }
        button { background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }

        .char-desc {
            font-size: 13px;
            color: #ccc;
            text-align: left;
            background: #0f3460;
            padding: 8px;
            border-radius: 5px;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        /* Ігровий інтерфейс */
        #game-screen { display: none; width: 100%; max-width: 950px; }
        .game-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        
        /* Ігрова дошка (Спрощена Монополія: 12 клітинок по периметру) */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            background: #fff;
            gap: 20px;
            padding: 2px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .cell {
            background: #252850;
            color: #fff;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            position: relative;
            border-radius: 4px;
        }
        /* Розташування клітинок по колу гри */
        .cell-0 { grid-column: 1; grid-row: 1; background: #2b7a78; } /* START */
        .cell-1 { grid-column: 2; grid-row: 1; border-top: 5px solid #ff4b4b; }
        .cell-2 { grid-column: 3; grid-row: 1; border-top: 5px solid #ff4b4b; }
        .cell-3 { grid-column: 4; grid-row: 1; background: #cca43b; } /* ШАНС */
        .cell-4 { grid-column: 4; grid-row: 2; border-right: 5px solid #3f72af; }
        .cell-5 { grid-column: 4; grid-row: 3; border-right: 5px solid #3f72af; }
        .cell-6 { grid-column: 4; grid-row: 4; background: #4e5180; } /* В'ЯЗНИЦЯ */
        .cell-7 { grid-column: 3; grid-row: 4; border-bottom: 5px solid #4e9f3d; }
        .cell-8 { grid-column: 2; grid-row: 4; border-bottom: 5px solid #4e9f3d; }
        .cell-9 { grid-column: 1; grid-row: 4; background: #cca43b; } /* ШАНС */
        .cell-10 { grid-column: 1; grid-row: 3; border-left: 5px solid #845ec2; }
        .cell-11 { grid-column: 1; grid-row: 2; border-left: 5px solid #845ec2; }

        .cell .price { color: #00ffcc; font-size: 10px; }
        .cell .lvl { color: #ffcc00; font-size: 9px; }

        /* Фішки гравців на клітинках */
        .tokens-container {
            display: flex;
            gap: 3px;
            position: absolute;
            bottom: 2px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .token {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 4px #000;
        }

        /* Панель керування та інформації */
        .control-panel {
            flex: 1;
            min-width: 300px;
            background: var(--panel-color);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .players-list, .log-box {
            background: #0f3460;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .log-box { height: 120px; overflow-y: auto; color: #a9b7c6; font-family: monospace; }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid #1a1a2e;
        }
        .dice-result {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>🎲 Тобнута Монополія 🎲</h1>

    <!-- 1. Екран авторизації та вибору ролі -->
    <div id="auth-screen">
        <h3>Введіть нікнейм та оберіть Клас</h3>
        <input type="text" id="username-input" placeholder="Твій нікнейм..." maxlength="12">
        
        <select id="role-select" onchange="updateRoleDescription()">
            <option value="shark">🦈 Акула бізнесу</option>
            <option value="investor">💰 Інвестор</option>
            <option value="manager">💼 Кризовий менеджер</option>
            <option value="raider">🥷 Рейдер</option>
        </select>
        <div id="role-desc" class="char-desc">Пасивний бонус: Отримує +$300 при проходженні кола замість $200.</div>

        <input type="text" id="room-input" placeholder="ID Кімнати (наприклад: room1)">
        <button onclick="joinGame()">Увійти в гру</button>
    </div>

    <!-- 2. Ігровий Екран -->
    <div id="game-screen">
        <div class="game-container">
            <!-- Дошка -->
            <div class="board" id="board">
                <!-- Картки генеруються скриптом -->
            </div>

            <!-- Панель управління -->
            <div class="control-panel">
                <div>
                    <h3>Гравці в кімнаті:</h3>
                    <div id="players-list" class="players-list"></div>

                    <h3>Події:</h3>
                    <div id="log-box" class="log-box"></div>
                </div>

                <div>
                    <div class="dice-result" id="dice-view">⚄ ⚁</div>
                    <button id="roll-btn" onclick="takeTurn()">Кинути кубики</button>
                    <button id="action-btn" style="display:none;" onclick="handleAction()"></button>
                    <button id="skip-btn" style="display:none; background:#555;" onclick="endTurn()">Передати хід</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ініціалізація ТГ WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user?.username) {
                document.getElementById('username-input').value = tg.initDataUnsafe.user.username;
            }
        }

        // КОНФІГУРАЦІЯ FIREBASE (Встав сюди свої ключі, якщо створив новий проєкт)
        const firebaseConfig = {
            databaseURL: "https://monopoliya-dbc97-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Опис здібностей персонажів
        const roleSkills = {
            shark: "Пасивний бонус: Отримує +$300 при проходженні кола замість $200.",
            investor: "Пасивний бонус: Отримує $50 кешбеку в банк, коли будь-який гравець купує або прокачує нерухомість.",
            manager: "Пасивний бонус: Оренда на його власних клітинках коштує на 15% дорожче для суперників.",
            raider: "Абилка: Може купувати фірми, які вже належать іншим гравцям, але за потрійну ціну."
        };

        function updateRoleDescription() {
            const role = document.getElementById('role-select').value;
            document.getElementById('role-desc').innerText = roleSkills[role];
        }

        // СТРУКТУРА КАРТОК НА ДОШЦІ (12 КЛІТИНОК)
        const boardData = [
            { id: 0, name: "🚀 СТАРТ", type: "start" },
            { id: 1, name: "🍏 ATB Market", type: "property", price: 150, rent: 20, owner: "", lvl: 1, color: "#ff4b4b" },
            { id: 2, name: "⛽ OKKO", type: "property", price: 200, rent: 30, owner: "", lvl: 1, color: "#ff4b4b" },
            { id: 3, name: "⚡ ШАНС", type: "chance" },
            { id: 4, name: "📱 Rozetka", type: "property", price: 250, rent: 40, owner: "", lvl: 1, color: "#3f72af" },
            { id: 5, name: "📦 Нова Пошта", type: "property", price: 300, rent: 55, owner: "", lvl: 1, color: "#3f72af" },
            { id: 6, name: "🚔 ТЦК / В'язниця", type: "jail" },
            { id: 7, name: "🍕 Silpo Pizza", type: "property", price: 350, rent: 70, owner: "", lvl: 1, color: "#4e9f3d" },
            { id: 8, name: "☕ Lviv Croissants", type: "property", price: 400, rent: 90, owner: "", lvl: 1, color: "#4e9f3d" },
            { id: 9, name: "⚡ ШАНС", type: "chance" },
            { id: 10, name: "💻 SoftServe", type: "property", price: 500, rent: 120, owner: "", lvl: 1, color: "#845ec2" },
            { id: 11, name: "🦅 ПриватБанк", type: "property", price: 600, rent: 160, owner: "", lvl: 1, color: "#845ec2" }
        ];

        const colors = ["#ff5722", "#4caf50", "#00bcd4", "#9c27b0", "#ffeb3b", "#e91e63"];
        
        let roomID = "";
        let myId = "";
        let myName = "";
        let myRole = "";
        let gameState = null;

        // Генерація карти на екрані
        function buildBoardGrid() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = "";
            boardData.forEach(cell => {
                const cellEl = document.createElement('div');
                cellEl.className = `cell cell-${cell.id}`;
                
                if (cell.type === "property") {
                    cellEl.innerHTML = `
                        <div>${cell.name}</div>
                        <div class="lvl" id="lvl-${cell.id}">Рівень: 1 (Стартап)</div>
                        <div class="price" id="price-${cell.id}">$${cell.price}</div>
                        <div class="tokens-container" id="tokens-${cell.id}"></div>
                    `;
                } else {
                    cellEl.innerHTML = `
                        <div>${cell.name}</div>
                        <div class="tokens-container" id="tokens-${cell.id}"></div>
                    `;
                }
                boardEl.appendChild(cellEl);
            });
        }

        // Вхід у гру та створення кімнати
        function joinGame() {
            myName = document.getElementById('username-input').value.trim();
            roomID = document.getElementById('room-input').value.trim();
            myRole = document.getElementById('role-select').value;

            if (!myName || !roomID) return alert("Введіть нік і кімнату!");

            myId = 'p_' + Math.random().toString(36).substr(2, 9);
            buildBoardGrid();

            // Підключаємося до кімнати у Firebase
            const roomRef = database.ref('rooms/' + roomID);
            roomRef.once('value', snapshot => {
                if (!snapshot.exists()) {
                    // Якщо кімнати немає, ініціалізуємо нову гру
                    const initialPlayers = {};
                    initialPlayers[myId] = {
                        id: myId, name: myName, role: myRole,
                        money: 1500, pos: 0, color: colors[0], inJail: false
                    };
                    
                    roomRef.set({
                        players: initialPlayers,
                        turn: myId,
                        turnOrder: [myId],
                        board: boardData,
                        logs: ["Кімнату створено розробником!"]
                    });
                } else {
                    // Якщо кімната є, додаємо гравця всередину
                    const data = snapshot.val();
                    const pCount = Object.keys(data.players || {}).length;
                    const pColor = colors[pCount % colors.length];

                    database.ref('rooms/' + roomID + '/players/' + myId).set({
                        id: myId, name: myName, role: myRole,
                        money: 1500, pos: 0, color: pColor, inJail: false
                    });

                    const newOrder = data.turnOrder || [];
                    newOrder.push(myId);
                    database.ref('rooms/' + roomID + '/turnOrder').set(newOrder);
                }

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';

                // Запуск прослуховування змін в реальному часі
                listenToRoom();
            });
        }

        // Синхронізація з Firebase
        function listenToRoom() {
            database.ref('rooms/' + roomID).on('value', snapshot => {
                if (!snapshot.exists()) return;
                gameState = snapshot.val();
                updateUI();
            });
        }

        // Оновлення графічного інтерфейсу на основі даних бази
        function updateUI() {
            // Очищення фішок
            for (let i = 0; i < 12; i++) {
                document.getElementById(`tokens-${i}`).innerHTML = "";
            }

            // Рендер фішок гравців та списку праворуч
            const listEl = document.getElementById('players-list');
            listEl.innerHTML = "";

            const pIds = Object.keys(gameState.players);
            pIds.forEach(id => {
                const p = gameState.players[id];
                
                // Додаємо фішку на поле
                const token = document.createElement('div');
                token.className = "token";
                token.style.backgroundColor = p.color;
                document.getElementById(`tokens-${p.pos}`).appendChild(token);

                // Оновлення списку рахунків
                const row = document.createElement('div');
                row.className = "player-row";
                row.style.borderLeft = `5px solid ${p.color}`;
                row.style.paddingLeft = "5px";
                
                // Візуальна позначка чий зараз хід
                const isHisTurn = gameState.turn === id ? " ➡️" : "";
                row.innerHTML = `
                    <span><b>${p.name}</b> (${getRoleName(p.role)})${isHisTurn}</span>
                    <span>$${p.money}</span>
                `;
                listEl.appendChild(row);
            });

            // Оновлення статусів власності на полі
            gameState.board.forEach(cell => {
                if (cell.type === "property") {
                    const lvlText = cell.owner ? `Власник: ${gameState.players[cell.owner]?.name || 'Банк'}<br>Рівень: ${cell.lvl}` : "Рівень: 1 (Стартап)";
                    document.getElementById(`lvl-${cell.id}`).innerHTML = lvlText;
                    document.getElementById(`price-${cell.id}`).innerText = cell.owner ? `Оренда: $${calculateRent(cell)}` : `Ціна: $${cell.price}`;
                }
            });

            // Оновлення логів подій
            const logBox = document.getElementById('log-box');
            logBox.innerHTML = gameState.logs ? gameState.logs.slice(-6).reverse().join("<br>") : "";

            // Керування доступністю кнопок для поточного гравця
            const rollBtn = document.getElementById('roll-btn');
            if (gameState.turn === myId) {
                rollBtn.disabled = false;
                rollBtn.style.background = varColor('--accent-color');
            } else {
                rollBtn.disabled = true;
                rollBtn.style.background = "#444";
            }
        }

        function getRoleName(r) {
            if (r === "shark") return "🦈Акула";
            if (r === "investor") return "💰Інвестор";
            if (r === "manager") return "💼Менеджер";
            return "🥷Рейдер";
        }

        // Проведення ходу
        function takeTurn() {
            if (gameState.turn !== myId) return;

            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 2) + 1; // Скорочений крок для карти на 12 клітинок
            const steps = d1 + d2;

            document.getElementById('dice-view').innerText = `⚄ ${d1} : ${d2} ⚂`;
            document.getElementById('roll-btn').style.display = 'none';

            let p = gameState.players[myId];
            let oldPos = p.pos;
            let newPos = (oldPos + steps) % 12;

            p.pos = newPos;

            let logMsg = `${p.name} кинув кубики на ${steps} і став на клітинку ${gameState.board[newPos].name}.`;

            // Якщо пройшов через СТАРТ
            if (newPos < oldPos) {
                let salary = p.role === "shark" ? 300 : 200;
                p.money += salary;
                logMsg += ` Пройшов коло і отримав $${salary}!`;
            }

            addLog(logMsg);
            
            // Перевірка куди саме став гравець
            evaluateCell(newPos, p);
        }

        // Обробка логіки клітинки
        function evaluateCell(pos, player) {
            const cell = gameState.board[pos];
            const actionBtn = document.getElementById('action-btn');
            const skipBtn = document.getElementById('skip-btn');

            actionBtn.style.display = 'block';
            skipBtn.style.display = 'block';

            if (cell.type === "property") {
                if (!cell.owner) {
                    // Фірма вільна — купуємо
                    actionBtn.innerText = `Купити ${cell.name} за $${cell.price}`;
                    actionBtn.onclick = () => buyProperty(pos);
                } else if (cell.owner === myId) {
                    // Наша фірма — можемо прокачати
                    if (cell.lvl < 3) {
                        const upgradeCost = Math.floor(cell.price * 0.6);
                        actionBtn.innerText = `Прокачати філію за $${upgradeCost}`;
                        actionBtn.onclick = () => upgradeProperty(pos, upgradeCost);
                    } else {
                        actionBtn.innerText = "Максимальний рівень корпорації!";
                        actionBtn.onclick = null;
                    }
                } else {
                    // Чужа нерухомість — платимо оренду або абилка Рейдера
                    let rent = calculateRent(cell);
                    
                    // Якщо власник менеджер, оренда дорожча
                    if (gameState.players[cell.owner]?.role === "manager") {
                        rent = Math.floor(rent * 1.15);
                    }

                    if (player.role === "raider") {
                        actionBtn.innerText = `Рейдерське захоплення за $${cell.price * 3}`;
                        actionBtn.onclick = () => raiderTakeover(pos, cell.price * 3, cell.owner);
                    } else {
                        actionBtn.innerText = `Сплатити оренду $${rent} гравцю ${gameState.players[cell.owner].name}`;
                        actionBtn.onclick = () => payRent(cell.owner, rent);
                        skipBtn.style.display = 'none'; // Не можна скинути оплату
                    }
                }
            } else if (cell.type === "chance") {
                actionBtn.innerText = "Тягнути картку Шанс";
                actionBtn.onclick = () => triggerChanceEvent();
                skipBtn.style.display = 'none';
            } else if (cell.type === "jail") {
                player.money -= 150;
                addLog(`🚨 Потрапив під перевірку документів! Штраф $150.`);
                actionBtn.style.display = 'none';
                endTurn();
            } else {
                // Просто клітинка старт
                actionBtn.style.display = 'none';
            }
        }

        // Розрахунок прогресивної оренди за рівнями
        function calculateRent(cell) {
            if (cell.lvl === 1) return cell.rent;
            if (cell.lvl === 2) return cell.rent * 3; // Рівень франшизи
            if (cell.lvl === 3) return cell.rent * 7; // Рівень корпорації
            return cell.rent;
        }

        function buyProperty(pos) {
            let p = gameState.players[myId];
            let cell = gameState.board[pos];

            if (p.money >= cell.price) {
                p.money -= cell.price;
                cell.owner = myId;
                cell.lvl = 1;
                addLog(`🛒 ${p.name} купив підприємство ${cell.name} за $${cell.price}!`);
                checkInvestorBonus(cell.price);
                saveAndEndTurn();
            } else {
                alert("Не вистачає лаве!");
            }
        }

        function upgradeProperty(pos, cost) {
            let p = gameState.players[myId];
            let cell = gameState.board[pos];

            if (p.money >= cost) {
                p.money -= cost;
                cell.lvl += 1;
                let lvlNames = ["", "Стартап", "Франшиза", "Корпорація"];
                addLog(`📈 ${p.name} прокачав ${cell.name} до рівня [${lvlNames[cell.lvl]}] за $${cost}!`);
                checkInvestorBonus(cost);
                saveAndEndTurn();
            } else {
                alert("Недостатньо грошей для модернізації.");
            }
        }

        function payRent(ownerId, amount) {
            let p = gameState.players[myId];
            p.money -= amount;
            if (gameState.players[ownerId]) {
                gameState.players[ownerId].money += amount;
            }
            addLog(`💸 ${p.name} виплатив оренду $${amount} власнику підприємства.`);
            saveAndEndTurn();
        }

        function raiderTakeover(pos, cost, oldOwnerId) {
            let p = gameState.players[myId];
            let cell = gameState.board[pos];
            if (p.money >= cost) {
                p.money -= cost;
                if (gameState.players[oldOwnerId]) gameState.players[oldOwnerId].money += Math.floor(cost/2);
                cell.owner = myId;
                addLog(`🥷 РЕЙДЕР! ${p.name} віджав компанію ${cell.name} у попереднього власника за $${cost}!`);
                saveAndEndTurn();
            } else {
                alert("Мало грошей для рейдерства.");
            }
        }

        // Картки шанс нового покоління
        function triggerChanceEvent() {
            let p = gameState.players[myId];
            const events = [
                { name: "Криптовалютний бум", action: () => { p.money += 400; return "Крипта злетіла! Ви заробили $400 на токенах."; } },
                { name: "Податкова перевірка", action: () => { p.money -= 250; return "Знайдено незадекларований дохід. Штраф налогової: $250."; } },
                { name: "Донат на ЗСУ", action: () => { p.money -= 100; return "Ви закинули на збір хлопцям. Респект і мінус $100."; } },
                { name: "Державна субсидія", action: () => { p.money += 200; return "Отримано грант на розвиток малого бізнесу: $200."; } }
            ];

            const ev = events[Math.floor(Math.random() * events.length)];
            const resText = ev.action();
            addLog(`⚡ ШАНС: ${resText}`);
            saveAndEndTurn();
        }

        // Пасивний бонус Інвестора
        function checkInvestorBonus(amount) {
            Object.keys(gameState.players).forEach(id => {
                if (gameState.players[id].role === "investor") {
                    gameState.players[id].money += 50;
                    gameState.logs.push(`💰 Кешбек: Інвестор ${gameState.players[id].name} отримав $50 пасивного доходу.`);
                }
            });
        }

        function addLog(msg) {
            if (!gameState.logs) gameState.logs = [];
            gameState.logs.push(msg);
        }

        function saveAndEndTurn() {
            // Шукаємо наступного за чергою
            const order = gameState.turnOrder;
            let idx = order.indexOf(myId);
            let nextIdx = (idx + 1) % order.length;
            gameState.turn = order[nextIdx];

            // Очищення кнопок дій перед новим ходом
            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('roll-btn').style.display = 'block';

            // Зберігаємо оновлений стан в базу Firebase
            database.ref('rooms/' + roomID).set(gameState);
        }

        function endTurn() {
            saveAndEndTurn();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
