<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Ultra Realtime Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --panel-border: #1f2937;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-light: #f9fafb;
            --text-gray: #9ca3af;
            
            --cell-w: 95px;
            --cell-h: 115px;
            --board-size: calc(var(--cell-w) * 7 + var(--cell-h) * 2 + 30px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            z-index: 10;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.3));
        }

        header p {
            font-size: 11px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* AUTH SCREEN */
        #auth-screen {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 500px;
            margin-top: 50px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 20;
        }

        .auth-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: #030712;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.2);
            transition: 0.2s;
        }

        /* GAME LAYOUT */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 1600px;
        }

        .main-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .board-wrapper {
            background: #030712;
            padding: 12px;
            border-radius: 24px;
            border: 2px solid var(--panel-border);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.9);
        }

        /* 9x9 Grid Layout */
        .board-grid {
            display: grid;
            grid-template-columns: var(--cell-h) repeat(7, var(--cell-w)) var(--cell-h);
            grid-template-rows: var(--cell-h) repeat(7, var(--cell-w)) var(--cell-h);
            gap: 4px;
            width: 100%;
        }

        .cell {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            position: relative;
            overflow: hidden;
        }

        /* Dynamic Stripes Orientation based on edge */
        .cell-stripe {
            position: absolute;
            background: transparent;
            z-index: 1;
        }

        /* Top Edge */
        .row-top .cell-stripe { top: 0; left: 0; right: 0; height: 12px; }
        /* Right Edge */
        .col-right .cell-stripe { right: 0; top: 0; bottom: 0; width: 12px; }
        /* Bottom Edge */
        .row-bottom .cell-stripe { bottom: 0; left: 0; right: 0; height: 12px; }
        /* Left Edge */
        .col-left .cell-stripe { left: 0; top: 0; bottom: 0; width: 12px; }

        .cell-title {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 14px;
            z-index: 2;
        }

        .cell-icon {
            font-size: 20px;
            margin: auto 0;
            z-index: 2;
        }

        .cell-price {
            font-size: 9px;
            font-weight: 700;
            color: var(--accent-cyan);
            z-index: 2;
        }

        /* Real Estate Management Visuals */
        .cell-infrastructure {
            position: absolute;
            display: flex;
            gap: 2px;
            z-index: 3;
        }
        .row-top .cell-infrastructure { top: 16px; }
        .col-right .cell-infrastructure { right: 16px; flex-direction: column; }
        .row-bottom .cell-infrastructure { bottom: 16px; }
        .col-left .cell-infrastructure { left: 16px; flex-direction: column; }

        .house-node { width: 6px; height: 6px; background: var(--accent-green); border-radius: 1px; }
        .hotel-node { width: 14px; height: 6px; background: var(--accent-red); border-radius: 1px; }

        .cell-owner-tag {
            position: absolute;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 4px;
            border-radius: 3px;
            text-transform: uppercase;
            z-index: 4;
        }
        .row-top .cell-owner-tag { bottom: 16px; }
        .col-right .cell-owner-tag { left: 16px; }
        .row-bottom .cell-owner-tag { top: 16px; }
        .col-left .cell-owner-tag { right: 16px; }

        /* Grid Placement Math for 9x9 */
        /* Top Row */
        .pos-0  { grid-column: 1; grid-row: 1; }
        .pos-1  { grid-column: 2; grid-row: 1; }
        .pos-2  { grid-column: 3; grid-row: 1; }
        .pos-3  { grid-column: 4; grid-row: 1; }
        .pos-4  { grid-column: 5; grid-row: 1; }
        .pos-5  { grid-column: 6; grid-row: 1; }
        .pos-6  { grid-column: 7; grid-row: 1; }
        .pos-7  { grid-column: 8; grid-row: 1; }
        .pos-8  { grid-column: 9; grid-row: 1; }
        /* Right Row */
        .pos-9  { grid-column: 9; grid-row: 2; }
        .pos-10 { grid-column: 9; grid-row: 3; }
        .pos-11 { grid-column: 9; grid-row: 4; }
        .pos-12 { grid-column: 9; grid-row: 5; }
        .pos-13 { grid-column: 9; grid-row: 6; }
        .pos-14 { grid-column: 9; grid-row: 7; }
        .pos-15 { grid-column: 9; grid-row: 8; }
        .pos-16 { grid-column: 9; grid-row: 9; }
        /* Bottom Row */
        .pos-17 { grid-column: 8; grid-row: 9; }
        .pos-18 { grid-column: 7; grid-row: 9; }
        .pos-19 { grid-column: 6; grid-row: 9; }
        .pos-20 { grid-column: 5; grid-row: 9; }
        .pos-21 { grid-column: 4; grid-row: 9; }
        .pos-22 { grid-column: 3; grid-row: 9; }
        .pos-23 { grid-column: 2; grid-row: 9; }
        .pos-24 { grid-column: 1; grid-row: 9; }
        /* Left Row */
        .pos-25 { grid-column: 1; grid-row: 8; }
        .pos-26 { grid-column: 1; grid-row: 7; }
        .pos-27 { grid-column: 1; grid-row: 6; }
        .pos-28 { grid-column: 1; grid-row: 5; }
        .pos-29 { grid-column: 1; grid-row: 4; }
        .pos-30 { grid-column: 1; grid-row: 3; }
        .pos-31 { grid-column: 1; grid-row: 2; }

        /* Board Inner Center */
        .board-center {
            grid-column: 2 / 9;
            grid-row: 2 / 9;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* REALTIME CENTRAL CORE CLICKER */
        .central-dice-platform {
            background: rgba(31, 41, 55, 0.4);
            border: 2px dashed var(--accent-cyan);
            border-radius: 20px;
            padding: 25px 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.05);
        }

        .central-dice-platform:hover {
            background: rgba(6, 182, 212, 0.08);
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
        }

        .dice-row {
            display: flex;
            gap: 20px;
        }

        .dice-cube {
            width: 65px;
            height: 65px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 12px;
            font-size: 42px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 -4px 0 #cbd5e1;
            transition: transform 0.1s;
        }

        .platform-callout {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-green);
        }

        .double-indicator {
            position: absolute;
            top: 20px;
            background: var(--accent-orange);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            display: none;
        }

        /* TOKEN RENDER HOUSING */
        .token-housing {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            z-index: 10;
        }

        .map-token {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
        }

        /* SIDE DASHBOARD */
        .side-panel {
            flex: 1;
            min-width: 360px;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .card-panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-gray);
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 8px;
        }

        /* ACTION HUB */
        .action-hub-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        .btn-buy { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #000; }
        .btn-build { background: linear-gradient(135deg, var(--accent-green), #059669); color: #000; }
        .btn-jail { background: var(--accent-orange); color: #000; }
        .btn-pass { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border); color: #fff; }

        .panel-btn:disabled {
            opacity: 0.2;
            pointer-events: none;
        }

        /* LEADERBOARD */
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.4);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid transparent;
        }

        .player-row.active-border {
            border-left-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.04);
        }

        .player-assets-cash {
            font-weight: 800;
            color: var(--accent-green);
            font-family: monospace;
            font-size: 15px;
        }

        /* TERMINAL LOGS */
        .terminal-log {
            height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-node {
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            border-left: 2px solid var(--panel-border);
            line-height: 1.4;
        }

        .log-node.sys { border-left-color: var(--accent-cyan); color: var(--accent-cyan); }
        .log-node.alert { border-left-color: var(--accent-red); color: var(--accent-red); }
        .log-node.good { border-left-color: var(--accent-green); color: var(--accent-green); }
        .log-node.warn { border-left-color: var(--accent-orange); color: var(--accent-orange); }

        @media (max-width: 1100px) {
            :root {
                --cell-w: 10.5vw;
                --cell-h: 12.5vw;
            }
            .side-panel { width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Monopoly Pro Realtime</h1>
        <p>Complete Corporate Engine • English UI</p>
    </header>

    <div id="auth-screen">

        <div class="input-group">
            <label>Strategic Archetype</label>
            <select id="corp-role-input">

                <option value="tycoon">💼 TYCOON (Infrastructural Upgrade Discount: -30%)</option>
            </select>
        </div>
        <button class="btn-launch" onclick="Engine.Core.bootstrap()">Deploy Session</button>
    </div>

    <div id="game-screen">
        <div class="main-container">
            
            <div class="board-wrapper">
                <div class="board-grid" id="board-grid-dom">
                    
                    <div class="board-center">
                        <div class="double-indicator" id="double-badge">Double Roll Asset Granted</div>
                        
                        <div class="central-dice-platform" id="dice-interactive-trigger" onclick="Engine.Gameplay.rollDice()">

                                <div class="dice-cube" id="cube-ui-1">⚀</div>
                                <div class="dice-cube" id="cube-ui-2">⚀</div>
                            </div>
                            <div class="platform-callout" id="platform-callout-text">👉 Click to Roll</div>
                        </div>

                        <div id="turn-descriptor" style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-gray); margin-top: 15px;">System Synced</div>
                    </div>

                </div>
            </div>

            <div class="side-panel">
                
                <div class="card-panel" id="action-panel-wks" style="display: none; border-color: var(--accent-cyan);">
                    <h3>⚡ Corporate Operations</h3>
                    <div class="action-hub-box">
                        <button class="panel-btn btn-buy" id="hub-action-buy">Acquire Asset</button>
                        <button class="panel-btn btn-build" id="hub-action-build">Construct Branch</button>
                        <button class="panel-btn btn-jail" id="hub-action-jail">Settle Bail Out ($50)</button>
                        <button class="panel-btn btn-pass" id="hub-action-pass" onclick="Engine.Gameplay.closeTurn()">Acknowledge & Continue</button>
                    </div>
                </div>

                <div class="card-panel">
                    <h3>📊 Boardroom Capitalization</h3>
                    <div id="leaderboard-dom-target"></div>
                </div>

                <div class="card-panel">
                    <h3>📜 Data Transmission Logs</h3>
                    <div class="terminal-log" id="terminal-dom-target"></div>
                </div>

            </div>

        </div>
    </div>

                logs: [],
                isRolling: false,
                consecutiveDoubles: 0,
                lastRollSum: 2,
                hasPendingAction: false
            },

            Core: {
                bootstrap: function() {
                    const name = document.getElementById('corp-name-input').value || "Syndicate Alpha";
                    const role = document.getElementById('corp-role-input').value;

                    Engine.State.players = {
                        p1: { id: "p1", name: name, role: role, cash: Engine.Config.startingCash, pos: 0, color: "var(--accent-cyan)", inJail: 0, isBot: false },
                        bot: { id: "bot", name: "Apex-AI (BlackRock)", role: "shark", cash: Engine.Config.startingCash, pos: 0, color: "var(--accent-red)", inJail: 0, isBot: true }
                    };

                    Engine.State.logs.push({ type: "sys", text: `🔒 Secure network operational. Session deployed by ${name}.` });
                    
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';

                    Engine.UI.renderBoardStructure();
                    Engine.UI.sync();
                }
            },

            Gameplay: {
                rollDice: function() {
                    if (Engine.State.activeTurn !== "p1" || Engine.State.isRolling || Engine.State.hasPendingAction) return;

                    let p = Engine.State.players[Engine.State.activeTurn];

                    Engine.State.isRolling = true;
                    document.getElementById('platform-callout-text').innerText = "🎰 CYCLING...";

                    let d1 = Math.floor(Math.random() * 6) + 1;
                    let d2 = Math.floor(Math.random() * 6) + 1;
                    Engine.State.lastRollSum = d1 + d2;

                    const diceGraphics = { 1: "⚀", 2: "⚁", 3: "⚂", 4: "⚃", 5: "⚄", 6: "⚅" };
                    let ticks = 0;

                    let loop = setInterval(() => {
                        document.getElementById('cube-ui-1').innerText = diceGraphics[Math.floor(Math.random() * 6) + 1];
                        document.getElementById('cube-ui-2').innerText = diceGraphics[Math.floor(Math.random() * 6) + 1];
                        ticks++;

                        if(ticks > 10) {
                            clearInterval(loop);
                            document.getElementById('cube-ui-1').innerText = diceGraphics[d1];
                            document.getElementById('cube-ui-2').innerText = diceGraphics[d2];

                            let isDouble = (d1 === d2);
                            Engine.State.isRolling = false;

                            // Handle Jail Context
                            if(p.inJail > 0) {
                                if(isDouble) {
                                    p.inJail = 0;
                                    Engine.State.logs.push({ type: "good", text: `🔓 Double Roll [${d1}:${d2}] broken! ${p.name} released from Jail.` });
                                    Engine.State.consecutiveDoubles = 0;
                                } else {
                                    p.inJail--;
                                    if(p.inJail === 0) {
                                        p.cash -= Engine.Config.jailBailoutCost;
                                        Engine.State.logs.push({ type: "warn", text: `🚨 Maximum Detention time reached. Mandatory $50 Bail processed. ${p.name} released.` });
                                    } else {
                                        Engine.State.logs.push({ type: "alert", text: `🚔 No Double rolled. ${p.name} remains under restriction (${p.inJail} turns left).` });
                                        Engine.Gameplay.closeTurn();
                                        return;
                                    }
                                }
                            } else {
                                if(isDouble) {
                                    Engine.State.consecutiveDoubles++;
                                    if(Engine.State.consecutiveDoubles === 3) {
                                        Engine.State.logs.push({ type: "alert", text: `🚨 3 Consecutive Doubles! ${p.name} arrested for Market Manipulation.` });
                                        p.pos = 9;
                                        p.inJail = 3;
                                        Engine.State.consecutiveDoubles = 0;
                                        Engine.Gameplay.closeTurn();
                                        return;
                                    }
                                    document.getElementById('double-badge').style.display = 'block';
                                } else {
                                    Engine.State.consecutiveDoubles = 0;
                                    document.getElementById('double-badge').style.display = 'none';
                                }
                            }

                            // Advance Position
                            let priorPos = p.pos;
                            p.pos = (p.pos + d1 + d2) % Engine.Config.totalCells;
                            Engine.State.logs.push({ type: "sys", text: `🎲 ${p.name} rolled [${d1}:${d2}]. Processing location tile ${p.pos}.` });

                            if(p.pos < priorPos) {
                                let reward = p.role === 'shark' ? 450 : Engine.Config.baseSalary;
                                p.cash += reward;
                                Engine.State.logs.push({ type: "good", text: `💸 Complete Lap Revenue processed. +$${reward} injected.` });
                            }

                            Engine.Gameplay.evaluateTileState(p);
                        }
                    }, 80);
                },

                evaluateTileState: function(p) {
                    let tile = Engine.Config.mapData[p.pos];
                    let uiHub = document.getElementById('action-panel-wks');
                    let bBtn = document.getElementById('hub-action-buy');
                    let uBtn = document.getElementById('hub-action-build');
                    let jBtn = document.getElementById('hub-action-jail');
                    let pBtn = document.getElementById('hub-action-pass');

                    uiHub.style.display = 'block';
                    bBtn.style.display = 'none';
                    uBtn.style.display = 'none';
                    jBtn.style.display = 'none';
                    pBtn.style.display = 'block';

                    Engine.State.hasPendingAction = true;
                    document.getElementById('dice-interactive-trigger').style.pointerEvents = 'none';
                    document.getElementById('platform-callout-text').innerText = "⚠️ ACTION REQUIRED";
                    document.getElementById('platform-callout-text').style.color = 'var(--accent-red)';

                    if(p.isBot) {
                        setTimeout(() => {
                            if(tile.type === "property" || tile.type === "railroad" || tile.type === "utility") {
                                if(!tile.owner && p.cash >= (tile.price + 150)) {
                                    p.cash -= tile.price; tile.owner = "bot"; if(tile.type === "property") tile.lvl = 1;
                                    Engine.State.logs.push({ type: "alert", text: `🤖 AI Capitalized asset: ${tile.name}.` });
                                } else if(tile.owner === "p1") {
                                    let fee = Engine.Gameplay.calculateRentLiability(tile);
                                    p.cash -= fee; Engine.State.players.p1.cash += fee;
                                    Engine.State.logs.push({ type: "good", text: `💸 AI Transferred rent obligation of $${fee} to your account.` });
                                    Engine.Gameplay.verifySolvency("bot");
                                } else if(tile.owner === "bot" && tile.type === "property" && tile.lvl < 6 && p.cash >= 300) {
                                    let upgradeFee = Math.round(tile.price * 0.6);
                                    p.cash -= upgradeFee; tile.lvl++;
                                    Engine.State.logs.push({ type: "alert", text: `🏢 AI Upgraded infrastructure on ${tile.name} to Tier ${tile.lvl}.` });
                                }
                            } else if(tile.type === "tax") {
                                p.cash -= tile.cost;
                                Engine.State.logs.push({ type: "alert", text: `🏛️ National Tax Liability claimed $${tile.cost} from AI.` });
                                Engine.Gameplay.verifySolvency("bot");
                            } else if(tile.type === "gotojail") {
                                p.pos = 9; p.inJail = 3;
                                Engine.State.logs.push({ type: "alert", text: `🚔 AI apprehended and escorted to Jail matrix.` });
                            } else if(tile.type === "chance" || tile.type === "chest") {
                                Engine.Gameplay.executeRandomEvent(p);
                            }
                            Engine.Gameplay.closeTurn();
                        }, 1200);
                        return;
                    }

                    // Human Interaction Logic
                    if(p.inJail > 0) {
                        jBtn.style.display = 'block';
                        jBtn.disabled = p.cash < Engine.Config.jailBailoutCost;
                        jBtn.onclick = () => {
                            p.cash -= Engine.Config.jailBailoutCost; p.inJail = 0;
                            Engine.State.logs.push({ type: "good", text: `💸 Bail accepted. You are clear for immediate release.` });
                            jBtn.style.display = 'none';
                            Engine.UI.sync();
                        };
                    }

                    if(tile.type === "property" || tile.type === "railroad" || tile.type === "utility") {
                        if(!tile.owner) {
                            bBtn.style.display = 'block';
                            bBtn.innerText = `Acquire ${tile.name} ($${tile.price})`;
                            bBtn.disabled = p.cash < tile.price;
                            bBtn.onclick = () => {
                                p.cash -= tile.price; tile.owner = "p1"; if(tile.type === "property") tile.lvl = 1;
                                Engine.State.logs.push({ type: "good", text: `💼 Asset added to portfolio: ${tile.name}` });
                                Engine.Gameplay.closeTurn();
                            };
                        } else if(tile.owner === "p1") {
                            if(tile.type === "property" && tile.lvl < 6) {
                                let upgradeCost = Math.round(tile.price * 0.6);
                                if(p.role === "tycoon") upgradeCost = Math.round(upgradeCost * 0.7);
                                
                                uBtn.style.display = 'block';
                                uBtn.innerText = `Upgrade Infrastructure ($${upgradeCost})`;
                                uBtn.disabled = p.cash < upgradeCost;
                                uBtn.onclick = () => {
                                    p.cash -= upgradeCost; tile.lvl++;
                                    Engine.State.logs.push({ type: "good", text: `⭐ ${tile.name} upgraded to Tier ${tile.lvl}.` });
                                    Engine.Gameplay.closeTurn();
                                };
                            }
                        } else {
                            let liability = Engine.Gameplay.calculateRentLiability(tile);
                            bBtn.style.display = 'block';
                            pBtn.style.display = 'none';
                            bBtn.innerText = `Liquidate Rent Due ($${liability})`;
                            bBtn.onclick = () => {
                                p.cash -= liability; Engine.State.players.bot.cash += liability;
                                Engine.State.logs.push({ type: "alert", text: `⚠️ Rent Liability of $${liability} cleared to competitors.` });
                                Engine.Gameplay.verifySolvency("p1");
                                Engine.Gameplay.closeTurn();
                            };
                        }
                    } else if(tile.type === "tax") {
                        bBtn.style.display = 'block'; pBtn.style.display = 'none';
                        bBtn.innerText = `Pay Sovereign Tax ($${tile.cost})`;
                        bBtn.onclick = () => {
                            p.cash -= tile.cost;
                            Engine.State.logs.push({ type: "alert", text: `🏛️ Tax protocol processed. -$${tile.cost}` });
                            Engine.Gameplay.verifySolvency("p1");
                            Engine.Gameplay.closeTurn();
                        };
                    } else if(tile.type === "gotojail") {
                        p.pos = 9; p.inJail = 3; Engine.State.consecutiveDoubles = 0;
                        Engine.State.logs.push({ type: "alert", text: `🚔 Detained by law enforcement. Moving directly to Jail.` });
                        Engine.Gameplay.closeTurn();
                    } else if(tile.type === "chance" || tile.type === "chest") {
                        Engine.Gameplay.executeRandomEvent(p);
                    }
                    Engine.UI.sync();
                },

                calculateRentLiability: function(tile) {
                    if(tile.type === "property") {
                        return tile.rent[tile.lvl];
                    }
                    if(tile.type === "railroad") {
                        let count = Engine.Config.mapData.filter(t => t.group === "rail" && t.owner === tile.owner).length;
                        return 25 * Math.pow(2, count - 1);
                    }
                    if(tile.type === "utility") {
                        let count = Engine.Config.mapData.filter(t => t.group === "util" && t.owner === tile.owner).length;
                        let multiplier = count === 2 ? 10 : 4;
                        return Engine.State.lastRollSum * multiplier;
                    }
                    return 0;
                },

                executeRandomEvent: function(p) {
                    let cards = Engine.Config.chanceCards;
                    let selected = cards[Math.floor(Math.random() * cards.length)];
                    Engine.State.logs.push({ type: "warn", text: `📜 EVENT: "${selected.txt}"` });

                    if(selected.type === "move") {
                        p.pos = selected.target;
                        if(p.pos === 0) p.cash += Engine.Config.baseSalary;
                    } else if(selected.type === "fine") {
                        p.cash -= selected.cash; Engine.Gameplay.verifySolvency(p.id);
                    } else if(selected.type === "gift") {
                        p.cash += selected.cash;
                    } else if(selected.type === "jail") {
                        p.pos = 9; p.inJail = 3;
                    } else if(selected.type === "repair") {
                        let branches = Engine.Config.mapData.filter(t => t.owner === p.id && t.lvl).reduce((acc, curr) => acc + curr.lvl, 0);
                        p.cash -= (branches * selected.houseCost); Engine.Gameplay.verifySolvency(p.id);
                    }
                },

                verifySolvency: function(pid) {
                    let target = Engine.State.players[pid];
                    if(target.cash < 0) {
                        alert(`💀 BANKRUPTCY PROCEDURES INITIATED. ${target.name} is insolvable. Game Over.`);
                        location.reload();
                    }
                },

                closeTurn: function() {
                    document.getElementById('action-panel-wks').style.display = 'none';
                    Engine.State.hasPendingAction = false;

                    // If double roll active and player did not get arrested, preserve turn privilege
                    if(Engine.State.consecutiveDoubles > 0 && Engine.State.players.p1.inJail === 0) {
                        Engine.State.logs.push({ type: "sys", text: `🔄 Double sequence retained. Extra roll authorized.` });
                    } else {
                        Engine.State.activeTurn = Engine.State.activeTurn === "p1" ? "bot" : "p1";
                    }

                    Engine.UI.sync();

                    if(Engine.State.players[Engine.State.activeTurn].isBot) {
                        let bPlayer = Engine.State.players.bot;
                        if(bPlayer.inJail > 0) {
                            bPlayer.inJail--;
                            Engine.State.logs.push({ type: "alert", text: `🚔 AI skips turn inside Jail facility.` });
                            Engine.Gameplay.closeTurn();
                        } else {
                            setTimeout(() => { Engine.Gameplay.rollDiceAI(); }, 1000);
                        }
                    }
                },

                rollDiceAI: function() {
                    let p = Engine.State.players.bot;
                    let d1 = Math.floor(Math.random() * 6) + 1;
                    let d2 = Math.floor(Math.random() * 6) + 1;
                    Engine.State.lastRollSum = d1 + d2;

                    let priorPos = p.pos;
                    p.pos = (p.pos + d1 + d2) % Engine.Config.totalCells;

                    const graphics = { 1: "⚀", 2: "⚁", 3: "⚂", 4: "⚃", 5: "⚄", 6: "⚅" };
                    document.getElementById('cube-ui-1').innerText = graphics[d1];
                    document.getElementById('cube-ui-2').innerText = graphics[d2];

                    Engine.State.logs.push({ type: "sys", text: `🤖 AI dispatched roll [${d1}:${d2}]. Processing position ${p.pos}` });

                    if(p.pos < priorPos) {
                        p.cash += Engine.Config.baseSalary;
                    }

                    Engine.Gameplay.evaluateTileState(p);
                }
            },

            UI: {
                renderBoardStructure: function() {
                    let grid = document.getElementById('board-grid-dom');
                    let centralHubHTML = grid.querySelector('.board-center').outerHTML;
                    grid.innerHTML = centralHubHTML;

                    Engine.Config.mapData.forEach(cell => {
                        let block = document.createElement('div');
                        block.className = `cell pos-${cell.id}`;
                        
                        // Detect Orientation class mapping
                        if(cell.id <= 8) block.classList.add('row-top');
                        else if(cell.id <= 16) block.classList.add('col-right');
                        else if(cell.id <= 24) block.classList.add('row-bottom');
                        else block.classList.add('col-left');

                        let barColor = Engine.Config.groupColors[cell.group] || "transparent";

                        block.innerHTML = `
                            <div class="cell-stripe" style="background:${barColor}"></div>
                            <div class="cell-infrastructure" id="infra-layer-${cell.id}"></div>
                            <div class="cell-title">${cell.name}</div>
                            <div class="cell-icon">${cell.icon || '🏢'}</div>
                            <div class="cell-owner-tag" id="owner-tag-${cell.id}"></div>
                            <div class="cell-price">${cell.price ? '$' + cell.price : ''}</div>
                            <div class="token-housing" id="tokens-layer-${cell.id}"></div>
                        `;
                        grid.appendChild(block);
                    });
                },

                sync: function() {
                    // Update Portfolio Layers
                    Engine.Config.mapData.forEach(cell => {
                        let tokenContainer = document.getElementById(`tokens-layer-${cell.id}`);
                        if(tokenContainer) tokenContainer.innerHTML = "";

                        let ownerTag = document.getElementById(`owner-tag-${cell.id}`);
                        let infraBox = document.getElementById(`infra-layer-${cell.id}`);

                        if(cell.owner) {
                            let parsedOwner = Engine.State.players[cell.owner];
                            if(ownerTag) {
                                ownerTag.innerText = parsedOwner.id === 'p1' ? 'YOU' : 'AI';
                                ownerTag.style.background = parsedOwner.color;
                                ownerTag.style.color = '#000';
                            }

                            if(infraBox && cell.type === 'property') {
                                infraBox.innerHTML = "";
                                if(cell.lvl === 6) {
                                    infraBox.innerHTML = `<div class="hotel-node"></div>`;
                                } else {
                                    for(let i = 1; i < cell.lvl; i++) {
                                        infraBox.innerHTML += `<div class="house-node"></div>`;
                                    }
                                }
                            }
                        }
                    });

                    // Render Vector Player Markers
                    Object.values(Engine.State.players).forEach(p => {
                        let token = document.createElement('div');
                        token.className = "map-token";
                        token.style.background = p.color;
                        let spot = document.getElementById(`tokens-layer-${p.pos}`);
                        if(spot) spot.appendChild(token);
                    });

                    // Room Capitalization Synchronizer
                    let boardRoom = document.getElementById('leaderboard-dom-target');
                    boardRoom.innerHTML = "";
                    Object.values(Engine.State.players).forEach(p => {
                        boardRoom.innerHTML += `
                            <div class="player-row ${Engine.State.activeTurn === p.id ? 'active-border' : ''}">
                                <div><strong>${p.name}</strong><br><small style="color:var(--text-gray); text-transform:uppercase;">${p.role}</small></div>
                                <div class="player-assets-cash">$${p.cash}</div>
                            </div>
                        `;
                    });

                    // Interactive State System Monitor
                    let isYourTurn = Engine.State.activeTurn === "p1";
                    document.getElementById('turn-descriptor').innerText = isYourTurn ? "Your Execution Window" : "AI Restructuring Matrix...";
                    
                    let targetClicker = document.getElementById('dice-interactive-trigger');
                    if(isYourTurn && !Engine.State.hasPendingAction) {
                        targetClicker.style.pointerEvents = 'auto';
                        document.getElementById('platform-callout-text').innerText = "👉 Click to Roll";
                        document.getElementById('platform-callout-text').style.color = 'var(--accent-green)';
                    } else {
                        targetClicker.style.pointerEvents = 'none';
                        if(!isYourTurn) {
                            document.getElementById('platform-callout-text').innerText = "🤖 AI IS THINKING";
                            document.getElementById('platform-callout-text').style.color = 'var(--accent-orange)';
                        }
                    }

                    // Flush Terminal Pipelines
                    let logMonitor = document.getElementById('terminal-dom-target');
                    logMonitor.innerHTML = Engine.State.logs.map(l => `<div class="log-node ${l.type}">${l.text}</div>`).reverse().join('');
                }
            }
        };
    </script>
</body>
</html>
